<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Gateway</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Sora', sans-serif; }

    @keyframes spin-slow {
      to { transform: rotate(360deg); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.4); }
      70% { box-shadow: 0 0 0 20px rgba(234, 88, 12, 0); }
      100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .spinner-ring {
      animation: spin-slow 1s linear infinite;
    }
    .popup-enter {
      animation: fade-in 0.3s ease-out forwards;
    }
    .btn-pulse {
      animation: pulse-ring 2s ease-out infinite;
    }
    .float-anim {
      animation: float 3s ease-in-out infinite;
    }
    .slide-up {
      animation: slide-up 0.5s ease-out forwards;
    }

    .grain-bg {
      background: #0f0f0f;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(234,88,12,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(251,146,60,0.06) 0%, transparent 50%);
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full overflow-auto grain-bg flex flex-col items-center justify-center px-6">
   <div class="float-anim mb-10">
    <svg width="72" height="72" viewbox="0 0 72 72" fill="none">
     <rect x="8" y="8" width="56" height="56" rx="16" stroke="#ea580c" stroke-width="2.5" fill="none" /> <circle cx="36" cy="32" r="8" stroke="#fb923c" stroke-width="2" fill="none" /> <path d="M36 40v10M30 46h12" stroke="#fb923c" stroke-width="2" stroke-linecap="round" />
    </svg>
   </div>
   <h1 id="landing-title" class="text-white text-3xl md:text-4xl font-bold tracking-tight mb-3 text-center">Token Gateway</h1>
   <p class="text-orange-300/60 text-sm mb-12 text-center max-w-xs">Generate a secure session token to proceed</p><button id="generate-btn" onclick="showPopup()" class="btn-pulse relative bg-orange-600 hover:bg-orange-500 active:scale-95 text-white font-semibold text-lg px-10 py-4 rounded-2xl transition-all duration-200 cursor-pointer"> Generate Token </button> <!-- POPUP OVERLAY -->
   <div id="popup-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div id="popup-box" class="popup-enter bg-neutral-900 border border-white/10 rounded-3xl p-10 flex flex-col items-center max-w-xs w-full mx-4">
     <svg class="spinner-ring mb-6" width="48" height="48" viewbox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="20" stroke="#2a2a2a" stroke-width="4" /> <path d="M44 24a20 20 0 0 0-20-20" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
     </svg>
     <p class="text-white font-semibold text-lg mb-1">Generating Token</p>
     <p id="popup-status" class="text-white/40 text-xs">Please wait...</p>
    </div>
   </div>
  </div>
  <script>
    // --- Token logic ---
    function generateToken() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let token = '';
      for (let i = 0; i < 32; i++) token += chars.charAt(Math.floor(Math.random() * chars.length));
      return token;
    }

    function showPopup() {
      const overlay = document.getElementById('popup-overlay');
      overlay.classList.remove('hidden');
      document.getElementById('popup-status').textContent = 'Please wait...';

      // Generate token in background
      const token = generateToken();
      const expiry = Date.now() + 30000;
      localStorage.setItem('session_token', token);
      localStorage.setItem('session_token_expiry', expiry.toString());

      // After 2s, redirect to page1.html
      setTimeout(() => {
        window.location.href = 'page1.html';
      }, 2000);
    }



    // --- Element SDK ---
    const defaultConfig = {
      background_color: '#0f0f0f',
      accent_color: '#ea580c',
      text_color: '#ffffff',
      surface_color: '#171717',
      muted_color: '#fb923c',
      font_family: 'Sora',
      font_size: 16,
      button_text: 'Generate Token',
      page1_heading: 'Access Granted'
    };

    async function onConfigChange(config) {
      const bg = config.background_color || defaultConfig.background_color;
      const accent = config.accent_color || defaultConfig.accent_color;
      const text = config.text_color || defaultConfig.text_color;
      const surface = config.surface_color || defaultConfig.surface_color;
      const font = config.font_family || defaultConfig.font_family;
      const size = config.font_size || defaultConfig.font_size;

      document.getElementById('app').style.background = bg;
      document.getElementById('landing-title').style.color = text;
      document.getElementById('landing-title').style.fontFamily = `${font}, sans-serif`;
      document.getElementById('landing-title').style.fontSize = `${size * 2}px`;

      const btn = document.getElementById('generate-btn');
      btn.style.backgroundColor = accent;
      btn.style.fontFamily = `${font}, sans-serif`;
      btn.style.fontSize = `${size * 1.1}px`;
      btn.textContent = config.button_text || defaultConfig.button_text;

      const h = document.getElementById('page1-heading');
      h.style.color = text;
      h.style.fontFamily = `${font}, sans-serif`;
      h.style.fontSize = `${size * 2}px`;
      h.textContent = config.page1_heading || defaultConfig.page1_heading;

      const popupBox = document.getElementById('popup-box');
      popupBox.style.backgroundColor = surface;
    }

    window.elementSdk.init({
      defaultConfig,
      onConfigChange,
      mapToCapabilities: (config) => ({
        recolorables: [
          { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
          { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
          { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
          { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
          { get: () => config.muted_color || defaultConfig.muted_color, set: (v) => { config.muted_color = v; window.elementSdk.setConfig({ muted_color: v }); } },
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
        fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } },
      }),
      mapToEditPanelValues: (config) => new Map([
        ['button_text', config.button_text || defaultConfig.button_text],
        ['page1_heading', config.page1_heading || defaultConfig.page1_heading],
      ])
    });

    lucide.createIcons();
  </script>

</html>
