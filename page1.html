<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 1 - Verification</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Sora', sans-serif; }

    @keyframes spin-slow {
      to { transform: rotate(360deg); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .spinner-ring {
      animation: spin-slow 1s linear infinite;
    }
    .preloader-enter {
      animation: fade-in 0.3s ease-out forwards;
    }
    .card-enter {
      animation: slide-up 0.5s ease-out forwards;
    }

    .grain-bg {
      background: #0f0f0f;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(234,88,12,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(251,146,60,0.06) 0%, transparent 50%);
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full overflow-auto grain-bg flex flex-col items-center justify-center px-6"><!-- PRELOADER -->
   <div id="preloader" class="preloader-enter flex flex-col items-center">
    <svg class="spinner-ring mb-6" width="48" height="48" viewbox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="20" stroke="#2a2a2a" stroke-width="4" /> <path d="M44 24a20 20 0 0 0-20-20" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
    </svg>
    <p class="text-white font-semibold text-lg mb-2">Processing</p>
    <p class="text-white/40 text-xs">Verifying...</p>
   </div><!-- RESULT CARD (hidden initially) -->
   <div id="result-card" class="card-enter hidden flex flex-col items-center max-w-sm w-full"><!-- SUCCESS CARD -->
    <div id="success-card" class="hidden w-full bg-neutral-900 border border-white/10 rounded-3xl p-8 text-center">
     <div class="mb-6">
      <svg width="64" height="64" viewbox="0 0 64 64" fill="none" class="mx-auto"><circle cx="32" cy="32" r="28" stroke="#ea580c" stroke-width="2.5" /> <path d="M22 32l6 6 14-14" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
     </div>
     <h2 class="text-white text-2xl font-bold mb-2">Access Granted</h2>
     <p class="text-white/60 text-sm mb-6">Your token has been verified successfully</p>
     <div class="bg-neutral-800 rounded-2xl p-4 mb-4">
      <p class="text-white/40 text-xs mb-2">Token</p>
      <p id="token-display" class="text-orange-400 text-sm font-mono break-all mb-3"></p>
      <p class="text-white/40 text-xs">Expires in: <span id="countdown" class="text-orange-400 font-semibold">30s</span></p>
     </div><button onclick="goBack()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-semibold py-3 rounded-xl transition-all duration-200"> Back to Gateway </button>
    </div><!-- DENIED CARD -->
    <div id="denied-card" class="hidden w-full bg-neutral-900 border border-white/10 rounded-3xl p-8 text-center">
     <div class="mb-6">
      <svg width="64" height="64" viewbox="0 0 64 64" fill="none" class="mx-auto"><circle cx="32" cy="32" r="28" stroke="#ef4444" stroke-width="2.5" /> <path d="M22 22l20 20M42 22l-20 20" stroke="#f87171" stroke-width="3" stroke-linecap="round" />
      </svg>
     </div>
     <h2 class="text-white text-2xl font-bold mb-2">Access Denied</h2>
     <p class="text-white/60 text-sm mb-6">Invalid or expired token. Please generate a new one.</p><button onclick="goBack()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-semibold py-3 rounded-xl transition-all duration-200"> Back to Gateway </button>
    </div>
   </div>
  </div>
  <script>
    function goBack() {
      window.location.href = 'index.html';
    }

    function verifyToken() {
      const token = localStorage.getItem('session_token');
      const expiry = localStorage.getItem('session_token_expiry');

      // Check if token exists and is not expired
      if (token && expiry && Date.now() < parseInt(expiry)) {
        return { valid: true, token, expiry: parseInt(expiry) };
      }
      return { valid: false };
    }

    // Wait 2 seconds, then verify and show result
    setTimeout(() => {
      const verification = verifyToken();
      const preloader = document.getElementById('preloader');
      const resultCard = document.getElementById('result-card');
      const successCard = document.getElementById('success-card');
      const deniedCard = document.getElementById('denied-card');

      preloader.classList.add('hidden');
      resultCard.classList.remove('hidden');

      if (verification.valid) {
        // Show success card
        successCard.classList.remove('hidden');
        document.getElementById('token-display').textContent = verification.token;

        // Start countdown timer
        const remainingMs = verification.expiry - Date.now();
        let remainingSeconds = Math.ceil(remainingMs / 1000);

        const countdownInterval = setInterval(() => {
          remainingSeconds--;
          document.getElementById('countdown').textContent = `${remainingSeconds}s`;

          if (remainingSeconds <= 0) {
            clearInterval(countdownInterval);
            document.getElementById('countdown').textContent = 'Expired';
          }
        }, 1000);
      } else {
        // Show denied card
        deniedCard.classList.remove('hidden');
      }
    }, 2000);
  </script>

</html>
